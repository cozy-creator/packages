version: "3"
silent: true

vars:
  LOCK_HUB: tensorhub # committed locks resolve against production
  HUBS: tensorhub local

tasks:
  # First-party packages publish at the root namespace (`--root`, Hub admins). Locks pin first-party callees exactly, so each release of X is followed by one of every package
  # whose lock holds X: relocked to it, patch-bumped, pushed to master, then published.
  # Every release is a candidate: published and yanked at once (an exact pin installs it; the unversioned default skips
  # it). The release agent tests it by hand (cozy-creator's release gate, the printed pins) and records the result; then
  # `task promote` un-yanks the gated releases (tracker design ci-v2, pre-release and promotion). Nothing here starts a
  # test. A dependent relocks to a yanked callee only when it pins it with ==.
  publish:
    desc: "Publish candidates from master to every hub (yanked), then cascade to their in-repo dependents: task publish -- qwen-image-2"
    cmds:
      - |
        set -euo pipefail; roots=" {{.CLI_ARGS}} "; changed=$roots
        pkg() { grep -qs cozy.application "$1/pyproject.toml"; }
        for r in $roots; do pkg "$r" || { echo "usage: task publish -- <package>..." >&2; exit 2; }; done
        git diff --quiet HEAD || { echo "commit or discard tracked changes first" >&2; exit 1; }
        git fetch -q origin master; git merge -q --ff-only FETCH_HEAD
        work=$(mktemp -d); trap 'git checkout -q -- .; rm -rf "$work"' EXIT
        ver() { grep -m1 '^version = ' "$1/pyproject.toml" | cut -d'"' -f2; }
        deps() { awk -F'"' '/^name = /{n=$2} /^source = / && /\/v1\/index\//{print n}' "$1/uv.lock"; }
        pinned() { for q in $up; do grep -A1 -x "name = \"$q\"" "$1/uv.lock" | grep -qx "version = \"$(ver "$q")\"" || return 1; done; }
        locked() { grep -A1 -x "name = \"$2\"" "$1/uv.lock" | sed -n 's/^version = "\(.*\)"$/\1/p'; }
        floor() { grep -oE "\"$2(\[[^]]*\])?>=[0-9][0-9.]*" "$1/pyproject.toml" | head -1 | sed 's/.*>=//'; }
        # A callee whose Runtime/TensorFS floor is above what the dependent locks takes the dependent's lock up too.
        raised() { for q in $up; do for d in cozy-runtime tensorfs; do f=$(floor "$q" "$d"); l=$(locked "$1" "$d")
          [ -n "$f" ] && [ -n "$l" ] && [ "$(printf '%s\n' "$f" "$l" | sort -V | head -1)" != "$f" ] && echo "$d"; done; done | sort -u; }
        published() {
          i=$(grep -om1 'https\?://[^"]*/v1/index/[^/]*/simple/' "$1/uv.lock"); a=${i%/simple/}
          cozy package info "${a##*/}/$1" --tensorhub "${i%%/v1/*}" --json | jq -e --arg v "$(ver "$1")" 'any(.releases[]; .release == $v)' >/dev/null
        }
        shipped=
        ship() {
          for h in {{.HUBS}}; do
            rm -rf "${work:?}/$1"; git archive HEAD "$1" | tar -x -C "$work"
            (cd "$work/$1" && cozy package publish --root --tensorhub "$h") && cozy package yank "$1@$(ver "$1")" --tensorhub "$h" -y
          done
          shipped="$shipped${shipped:+,}$1@$(ver "$1")"
        }
        trap 'git checkout -q -- .; rm -rf "$work"; [ -z "$shipped" ] || echo "candidates (yanked): $shipped
        gate: gh workflow run release-gate.yml -R cozy-creator/cozy-creator -f suites=packages -f pins=$shipped -f only=$(echo "$shipped" | sed "s/@[^,]*//g")
        then: task promote GATE=<passing release-gate run id>  (a hand gate: GATE=<its dirs> RECORD=<URL of its recorded result>)"' EXIT
        release() {
          if ! git diff --quiet HEAD; then
            git commit -q -m "$1 $(ver "$1"): lock$(for q in $up; do printf ' %s %s' "$q" "$(ver "$q")"; done)" -- "$1"
            until git push -q origin HEAD:master; do
              git fetch -q origin master
              git diff --quiet HEAD~1 FETCH_HEAD -- "$1" || { git reset -q --keep HEAD~1; echo "master changed $1 during its release; run again" >&2; exit 1; }
              git rebase -q FETCH_HEAD
            done
          fi
          ship "$1"
        }
        for p in $(for p in */pyproject.toml; do p=${p%/pyproject.toml}; pkg "$p" || continue; echo "$p $p"; deps "$p" | sed "s|\$| $p|"; done | tsort); do
          pkg "$p" || continue
          case $roots in *" $p "*) up=; release "$p"; continue ;; esac
          up=$(for q in $(deps "$p"); do case $changed in *" $q "*) echo "$q" ;; esac; done)
          [ -n "$up" ] || continue
          changed="$changed$p "
          published "$p" || { echo "$p $(ver "$p") on master is unpublished; release it first: task publish -- $p" >&2; exit 1; }
          if pinned "$p"; then ship "$p"; continue; fi
          uv version -q --bump patch --frozen --project "$p"
          (cd "$p" && cozy package lock --root --tensorhub {{.LOCK_HUB}} $(printf ' --upgrade-package=%s' $up $(raised "$p")))
          pinned "$p" || { echo "$p: the relock did not take $up at their released versions" >&2; exit 1; }
          release "$p"
        done

  # The release gate passed these candidates: cozy-creator's release-gate/promote.sh, the one promotion, makes the
  # gated set users' (its pins the unversioned default on every hub that holds them).
  promote:
    desc: "Promote a passed gate's set: task promote GATE=<passing release-gate run id> [-- --dry-run] (hand gate: GATE=<dirs> RECORD=<URL>)"
    requires:
      vars: [GATE]
    cmds:
      - |
        set -euo pipefail; creator=${CREATOR:-../cozy-creator}
        record=(); [ -z "{{.RECORD}}" ] || record=(--record "{{.RECORD}}")
        "$creator/release-gate/promote.sh" {{.CLI_ARGS}} "${record[@]}" {{.GATE}}
