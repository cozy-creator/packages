[project]
name = "pan2"
version = "0.2.0rc3"
description = "PAN2 action-driven text-to-video and first-frame animation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cozy-runtime[adapters,media]>=0.47.0.dev0,<0.48",
    "diffusers>=0.43,<0.44",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.25.0",
    "tokenizers>=0.23.1",
    "torch>=2.14",
    "transformers>=5.19,<5.20",
]

[project.entry-points."cozy.application"]
default = "pan2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pan2"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

