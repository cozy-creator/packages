[project]
name = "birefnet"
version = "0.1.0"
description = "BiRefNet background removal for supplied character references"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.30",
    "einops>=0.8",
    "kornia>=0.8",
    "msgspec>=0.19",
    "pillow>=12",
    "timm>=1.0",
    "tensorfs>=0.13",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "birefnet:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birefnet"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
