[project]
name = "orbit"
version = "0.1.0"
description = "Orbit: a picture's subject seen from all the way round, one clockwise camera turn by MiniMax H3 and ORB360"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cozy-runtime[media]>=0.46.0,<0.47",
    "minimax-h3>=0.12.0rc2",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
]

[project.entry-points."cozy.application"]
default = "orbit:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
minimax-h3 = { index = "tensorhub" }
