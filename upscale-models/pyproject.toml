[project]
name = "upscale-models"
version = "0.1.0rc1"
description = "Dedicated upscale networks (spandrel's architectures) for pictures"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.48.0.dev0,<0.50",
    "msgspec>=0.19",
    "pillow>=12",
    "spandrel>=0.4.2,<0.5",
    "tensorfs>=0.16",
    "torch>=2.10",
]

[project.entry-points."cozy.application"]
default = "upscale_models:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upscale_models"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
