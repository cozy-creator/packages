[project]
name = "hunyuan-image-3"
version = "0.11.0rc3"
description = "Cozy text-to-image and reference editing with Tencent's HunyuanImage 3.0 Instruct and Instruct-Distil"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.47.0.dev0,<0.48",
    "einops>=0.8",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.16",
    # Tencent's code (written for Transformers 4.57) on Transformers 5: the tokenizer and the SigLIP2 image
    # processor are Transformers'.
    "tokenizers>=0.23.1",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=5.23,<6",
]

[project.entry-points."cozy.application"]
default = "hunyuan_image_3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hunyuan_image_3"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
