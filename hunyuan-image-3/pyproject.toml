[project]
name = "hunyuan-image-3"
version = "0.1.0"
description = "Cozy text-to-image and reference editing with Tencent's HunyuanImage 3.0 Instruct and Instruct-Distil"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.33",
    "einops>=0.8",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.16",
    # Tencent's code targets Transformers 4.57 (its requirements pin 4.57.1): the tokenizer and the
    # SigLIP2 image processor are Transformers'.
    "tokenizers>=0.22,<0.23",
    "torch>=2.13",
    "torchvision>=0.28",
    "transformers>=4.57.1,<4.58",
]

[project.entry-points."cozy.application"]
default = "hunyuan_image_3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hunyuan_image_3"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
