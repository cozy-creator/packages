# Not a distributed package: this repository contains first-party package source trees,
# while each child project owns its own lock and publication. This file holds STATIC ANALYSIS
# configuration, which is required (tracker README, owner directive 2026-08-25) — the
# no-tests rule bans test suites, not type checking.

[tool.basedpyright]
# The editor's language server only; the required check is mypy (scripts/typecheck.sh).
include = [
    "anima",
    "birefnet",
    "fibo-2",
    "flux-2",
    "flux-3-klein",
    "hidream-o1",
    "hunyuan-image-3",
    "ideogram-4",
    "krea-2",
    "minimax-h3",
    "moss-image",
    "qwen3.5",
    "qwen3.6",
    "qwen-image",
    "qwen-image-2",
    "sdxl",
    "seedvr2",
    "scripts",
    "examples",
]
exclude = ["**/.venv", "birefnet/birefnet/upstream", "seedvr2/seedvr2/upstream", "hunyuan-image-3/hunyuan_image_3/tencent"]
extraPaths = [
    "anima",
    "birefnet",
    "fibo-2",
    "flux-2",
    "flux-3-klein",
    "hidream-o1",
    "hunyuan-image-3",
    "ideogram-4",
    "krea-2",
    "minimax-h3",
    "moss-image",
    "qwen3.5",
    "qwen3.6",
    "qwen-image",
    "qwen-image-2",
    "sdxl",
    "seedvr2",
]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
# `from diffusers import X` is Diffusers' public API; its lazy `__init__` re-exports nothing the checker can see.
reportPrivateImportUsage = false

# The required type check (scripts/typecheck.sh), against the real Runtime and libraries in
# scripts/typecheck-requirements.txt. `Any` is an error; one a third-party boundary needs carries
# `# type: ignore[explicit-any]  # <why>`. Known errors live in .mypy-baseline.txt, which only shrinks.
# Local stubs for the untyped libraries' parts we call go in typings/.
[tool.mypy]
python_version = "3.12"
files = [
    "anima", "birefnet", "qwen3.5", "seedvr2", "minimax-h3", "sdxl", "qwen-image-2", "qwen-image", "flux-2",
    "flux-3-klein", "fibo-2", "hidream-o1", "hunyuan-image-3", "ideogram-4", "moss-image", "qwen3.6", "krea-2",
    "relayvsr", "orbit", "scripts", "examples",
]
mypy_path = [
    "typings", "anima", "birefnet", "fibo-2", "flux-2", "flux-3-klein", "hidream-o1", "hunyuan-image-3", "ideogram-4",
    "krea-2", "minimax-h3", "moss-image", "qwen3.5", "qwen3.6", "qwen-image", "qwen-image-2",
    "relayvsr", "orbit", "sdxl", "seedvr2",
]
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
implicit_reexport = false
# Not redundant-expr: a runtime check of a value from other code stays, though its type rules the value out.
enable_error_code = ["ignore-without-code", "possibly-undefined", "truthy-bool"]
# torch leaves a few of its own functions unannotated (torch.cuda.Event(), is_initialized()).
untyped_calls_exclude = ["torch"]
exclude = ["^birefnet/birefnet/upstream/", "^seedvr2/seedvr2/upstream/", "^hunyuan-image-3/hunyuan_image_3/tencent/"]

# Untyped libraries (no py.typed) until typings/ covers what we call, and modules only a proof fetches.
[[tool.mypy.overrides]]
module = [
    "torchvision", "torchvision.*", "triton", "triton.*", "hidiffusion", "hidiffusion.*",
    "rotary_embedding_torch", "rotary_embedding_torch.*", "accelerate", "accelerate.*",
    "tfsbench", "cozy_eval", "cozy_eval.*",
    # BFL's reference code, fetched by its model proof at run time.
    "flux3", "flux3.*",
]
ignore_missing_imports = true

# A @triton.jit kernel's `def` line and body are its Triton cache key (the Runtime's `TritonKernels.identity`):
# annotating one misses every prebuilt kernel. So the codes an untyped kernel def raises are off in the modules
# holding kernels, for the whole module (mypy has no per-function setting); every other check applies there.
[[tool.mypy.overrides]]
module = ["minimax_h3.glue", "relayvsr.kernels"]
disable_error_code = ["no-untyped-def", "no-any-unimported", "untyped-decorator"]
disallow_any_decorated = false
# A def line's own `# type: ignore` is part of its cache key too, so one these settings make unused stays.
warn_unused_ignores = false

# Attributed upstream architecture is exercised by its real constructor and model proof.
[[tool.mypy.overrides]]
module = ["birefnet.upstream.*", "seedvr2.upstream.*", "hunyuan_image_3.tencent.*"]
follow_imports = "skip"
ignore_errors = true

[tool.ruff]
line-length = 100
src = [
    "anima", "minimax-h3", "sdxl", "qwen-image-2", "qwen-image", "flux-3-klein", "fibo-2", "moss-image", "scripts", "examples",
]
exclude = [".venv", "birefnet/birefnet/upstream", "seedvr2/seedvr2/upstream", "hunyuan-image-3/hunyuan_image_3/tencent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Line length and import order are formatting, not merge gates.
ignore = ["E501", "I001"]
