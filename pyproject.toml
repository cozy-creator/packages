# Not a distributed package: this repository contains first-party package source trees,
# while each child project owns its own lock and publication. This file holds STATIC ANALYSIS
# configuration, which is required (tracker README, owner directive 2026-08-25) — the
# no-tests rule bans test suites, not type checking.

[tool.mypy]
python_version = "3.12"
files = [
    "anima", "birefnet", "qwen3.5", "seedvr2", "minimax-h3", "sdxl", "qwen-image-2", "qwen-image", "flux-2",
    "flux-3-klein", "fibo-2", "hidream-o1", "hunyuan-image-3", "ideogram-4", "moss-image", "qwen3.6", "krea-2",
    "scripts", "examples", "minimax-h3-tools/src",
]
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false
exclude = ["^birefnet/birefnet/upstream/", "^seedvr2/seedvr2/upstream/", "^hunyuan-image-3/hunyuan_image_3/tencent/"]

# Static checks install the typed Runtime distribution from PyPI. Heavy model libraries remain
# absent to check the package-facing contracts without their large third-party stub trees.
# Runtime behavior and imported descriptors use the full locked dependency environment.
[[tool.mypy.overrides]]
module = [
    "torch.*", "torchvision.*", "transformers.*", "tokenizers.*", "numpy.*", "PIL.*",
    "safetensors.*", "diffusers.*", "tfsbench", "tensorfs", "tensorfs.*", "cozy_eval.*",
    "av", "av.*", "omegaconf", "omegaconf.*", "triton", "triton.*",
    # BFL's reference code, fetched by its model proof at run time.
    "flux3", "flux3.*",
]
ignore_missing_imports = true

# h3_tables decorates with `@torch.inference_mode()`; torch is intentionally absent from
# the light checking environment, so the decorator is untyped here and fully typed in the
# package's own locked venv.
[[tool.mypy.overrides]]
module = ["h3_tables", "h3_tables.*"]
disallow_untyped_decorators = false

# These two older packages subclass optional Torch surfaces that are intentionally absent
# from the light checking environment. H3's Runtime author surface remains fully typed.
[[tool.mypy.overrides]]
module = ["anima", "anima.*", "sdxl"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_unused_ignores = false

# Model classes subclass Diffusers' and Torch's own, which this light environment does not carry.
[[tool.mypy.overrides]]
module = ["qwen_image_2.model", "qwen_image.model", "flux_3_klein.klein", "seedvr2.model", "flux_2.model", "flux_2.turbo", "fibo_2.model", "fibo_2.upsampler", "hidream_o1.model", "moss_image.model", "krea_2.model"]
disallow_subclassing_any = false
warn_unused_ignores = false

# MotionVideo extends Diffusers' reference class, also absent from the light environment.
[[tool.mypy.overrides]]
module = ["minimax_h3.official"]
disallow_subclassing_any = false

# Attributed upstream architecture is exercised by its real constructor and model proof.
[[tool.mypy.overrides]]
module = ["birefnet.upstream.*", "seedvr2.upstream.*", "hunyuan_image_3.tencent.*"]
follow_imports = "skip"
ignore_errors = true

[tool.ruff]
line-length = 100
src = [
    "anima", "minimax-h3", "sdxl", "qwen-image-2", "qwen-image", "flux-3-klein", "fibo-2", "moss-image", "scripts", "examples",
    "minimax-h3-tools",
]
exclude = [".venv", "birefnet/birefnet/upstream", "seedvr2/seedvr2/upstream", "hunyuan-image-3/hunyuan_image_3/tencent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Line length and import order are formatting, not merge gates.
ignore = ["E501", "I001"]
