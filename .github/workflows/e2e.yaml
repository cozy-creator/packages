name: e2e
# CI v2 (tracker/design/ci-v2.md): cozy-creator's e2e suites, selected by what the change touches. Required for
# merges into master and rc/*: it runs on the merge queue's group (merge_group), on the final PR + branch state;
# on a pull request the called workflow skips its suites, which lets the PR be queued. The required check is
# this job's `e2e / e2e`.
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      select:
        description: Test suites to run
        required: false
        type: string
        default: ''
jobs:
  e2e:
    # Keep the isolated test harness fixed while candidates follow the open RC.
    uses: cozy-creator/cozy-creator/.github/workflows/e2e.yaml@c445e313128bc476031c7bfd4d01c4ef40bf30d8
    secrets:
      TENSORHUB_READ_KEY: ${{ secrets.TENSORHUB_READ_KEY }}
    with:
      repo: packages
      ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
      base: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      select: ${{ inputs.select }}
      creator_ref: c445e313128bc476031c7bfd4d01c4ef40bf30d8
      stack_ref: rc/0.25.0
      runtime_ref: rc/0.25.0
      packages_ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
