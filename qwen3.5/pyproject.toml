[project]
name = "qwen3.5"
version = "0.1.2"
description = "Qwen3.5: single-turn questions about text, images and videos"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.36.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.16",
    "tokenizers>=0.23",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "qwen3_5:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen3_5"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
