# One dependency authority for this package: this file plus `uv.lock`.
#
# The lock defines the isolated package environment. Compatible dependencies can reuse
# the worker cache; base-image versions are accelerators, not compatibility limits.

[project]
name = "sdxl"
version = "0.6.1"
description = "Stable Diffusion XL text-to-image"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cozy-runtime[adapters,media]>=0.42.0",
    "diffusers>=0.40.0,<0.41",
    "hf-xet>=1.6.0",
    "hidiffusion>=0.1.10",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "shellingham>=1.5.4",
    "tensorfs>=0.17",
    "tokenizers>=0.23.1",
    "torch>=2.6",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "sdxl:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdxl"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# The 0.22 line's Runtime (0.43's tools with the 0.21.3 batch) and the TensorFS it pins, by git rev until
# both publish: the release relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "20ce678ad9c78e79384cc48544e9bf80c5955f18" }
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "7956c48e26c35a6a2ce47d52b273e5b1cd298e1b", subdirectory = "crates/tensorfs-py" }
