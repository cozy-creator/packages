# One dependency authority for this package: this file plus `uv.lock`.
#
# The lock defines the isolated package environment. Compatible dependencies can reuse
# the worker cache; base-image versions are accelerators, not compatibility limits.

[project]
name = "sdxl"
version = "0.7.1"
description = "Stable Diffusion XL text-to-image"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cozy-runtime[adapters,media]>=0.43.1,<0.44",
    "diffusers>=0.40.0,<0.41",
    "hf-xet>=1.6.0",
    "hidiffusion>=0.1.10",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "shellingham>=1.5.4",
    "tensorfs>=0.17",
    "tokenizers>=0.23.1",
    "torch>=2.6",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "sdxl:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdxl"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# 0.22.1's Runtime (0.43.1: 0.43's tools with the 0.21.3 batch) and the TensorFS it pins, by git rev until
# both publish: the release relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "f1cec0d53ff1e82573e1ad2090f81bdea543e51a" }
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "2df21cbc053a6a793e56ab59d02a25aaad5f6727", subdirectory = "crates/tensorfs-py" }
