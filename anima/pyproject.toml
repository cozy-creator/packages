[project]
name = "anima"
version = "0.7.0"
description = "Anima anime text-to-image package for Cozy"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cozy-runtime[media]>=0.44.0,<0.45",
    "diffusers>=0.40.0",
    "hf-xet>=1.6.0",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "shellingham>=1.5.4",
    "tensorfs>=0.16",
    "tokenizers>=0.23.1",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "anima:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anima"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[tool.mypy]
python_version = "3.12"
files = ["anima"]
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# 0.23.1's Runtime and the TensorFS it pins, by git rev until both publish: the release relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "ae8431178db9c455ca328322fe1285ea7c582a86" }
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "56fa475889897709c2f198e37295e352223cd8d0", subdirectory = "crates/tensorfs-py" }
