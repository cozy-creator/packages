[project]
name = "qwen-image"
version = "0.9.0"
description = "Cozy image generation and editing using Qwen-Image-2512 and Qwen-Image-Edit-2511, full and Lightning"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.44.0,<0.45",
    "diffusers>=0.41,<0.42",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "qwen_image:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_image"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# The Runtime with the simplified author API (xs-161) by git rev until it publishes: the release
# relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "8ad575e66647dc29bf3217f496497de69b5e07e7" }
