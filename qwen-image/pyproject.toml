[project]
name = "qwen-image"
version = "0.7.1"
description = "Cozy image generation and editing using Qwen-Image-2512 and Qwen-Image-Edit-2511, full and Lightning"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.43.1,<0.44",
    "diffusers>=0.41,<0.42",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "qwen_image:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_image"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# 0.22.1's Runtime (0.43.1: 0.43's tools with the 0.21.3 batch) and the TensorFS it pins, by git rev until
# both publish: the release relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "28bca694a119c82a30226f3500af527eb8ed0b77" }
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "747f1e128700eec8079f1a9b8e09d61659143d60", subdirectory = "crates/tensorfs-py" }
