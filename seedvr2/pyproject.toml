[project]
name = "seedvr2"
version = "0.4.1"
description = "SeedVR2 7B temporally consistent video restoration"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.43.1",
    "diffusers>=0.40",
    "einops>=0.8",
    "msgspec>=0.19",
    "numpy>=2",
    "omegaconf>=2.3",
    "pillow>=12",
    "rotary-embedding-torch>=0.5.3",
    "tensorfs>=0.16",
    "torch>=2.10",
    "torchvision>=0.21",
]

[project.entry-points."cozy.application"]
default = "seedvr2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seedvr2"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# 0.22.1's Runtime (0.43.1: 0.43's tools with the 0.21.3 batch) and the TensorFS it pins, by git rev until
# both publish: the release relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "858f6cc5df6fc7a7c0bee0fc9478706daa621a53" }
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "7956c48e26c35a6a2ce47d52b273e5b1cd298e1b", subdirectory = "crates/tensorfs-py" }
