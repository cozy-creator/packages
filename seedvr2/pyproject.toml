[project]
name = "seedvr2"
version = "0.1.2"
description = "SeedVR2 7B temporally consistent video restoration"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.36.0",
    "diffusers>=0.40",
    "einops>=0.8",
    "msgspec>=0.19",
    "numpy>=2",
    "omegaconf>=2.3",
    "pillow>=12",
    "rotary-embedding-torch>=0.5.3",
    "tensorfs>=0.16",
    "torch>=2.14",
    "torchvision>=0.29",
]

[project.entry-points."cozy.application"]
default = "seedvr2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seedvr2"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
