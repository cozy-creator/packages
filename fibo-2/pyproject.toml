[project]
name = "fibo-2"
version = "0.4.1"
description = "Cozy text-to-image and image editing with Bria Fibo 2.0, Dev and Edit Turbo"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[adapters,media]>=0.41.0",
    # BriaFibo2Pipeline is in Diffusers main only (#14991, merged 2026-10-20).
    "diffusers @ git+https://github.com/huggingface/diffusers@48cdbaef5ee3d718aaee392b44f2099ae511c4a5",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.16",
    "tokenizers>=0.23.1",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "fibo_2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fibo_2"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# The 0.22 line's Runtime (0.43's tools with the 0.21.3 batch) and the TensorFS it pins, by git rev until
# both publish: the release relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "81a12bc0a05ca21dab266149537cb6a82210a1af" }
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "7956c48e26c35a6a2ce47d52b273e5b1cd298e1b", subdirectory = "crates/tensorfs-py" }
