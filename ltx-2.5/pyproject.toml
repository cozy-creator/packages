[project]
name = "ltx-2.5"
version = "0.3.2rc1"
description = "LTX-2.5 synchronized video and audio from text or a first frame"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cozy-runtime[media]>=0.48.0.dev0,<0.50",
    "diffusers>=0.43,<0.44",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "sentencepiece>=0.2",
    "tensorfs>=0.25.0",
    "tokenizers>=0.22.0",
    "torch>=2.14",
    # The customized Gemma4 encoder's upstream verified minor; keep later minors as a separate qualification.
    "transformers>=5.14.1,<5.15",
]

[project.entry-points."cozy.application"]
default = "ltx_2_5:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ltx_2_5"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
