[project]
name = "ltx-2.5"
version = "0.4.0rc4"
description = "LTX-2.5 synchronized video and audio from text or a first frame, a take continued, and a range of a take redone"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Outputs.splice_video (cozy-runtime #2347): a retake and a pickup copy every packet outside their window.
    # The cross-modal attentions' Ulysses through the backend (`parallel.py`): Q rows unlike K/V's cross on the
    # group's exchange from cozy-runtime #2312 (rc/0.28.0 f10a6d177, its build 2403).
    "cozy-runtime[media]>=0.49.0.dev2403,<0.50",
    "diffusers>=0.43,<0.44",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "sentencepiece>=0.2",
    "tensorfs>=0.25.0",
    "tokenizers>=0.22.0",
    "torch>=2.14",
    # The customized Gemma4 encoder's upstream verified minor; keep later minors as a separate qualification.
    "transformers>=5.14.1,<5.15",
]

[project.entry-points."cozy.application"]
default = "ltx_2_5:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ltx_2_5"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
