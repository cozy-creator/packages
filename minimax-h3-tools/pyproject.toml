[project]
name = "minimax-h3-tools"
version = "0.1.4"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cozy-runtime>=0.33",
    "tensorfs>=0.16",
    "msgspec>=0.19",
    "numpy>=1.26",
    "torch>=2.14",
]

[project.entry-points."cozy.application"]
default = "h3_tables.job:app"

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_tables"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
