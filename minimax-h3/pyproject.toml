[project]
name = "minimax-h3"
version = "0.2.3"
description = "MiniMax H3 video with sound: one continuous shot of any length, and its upscale"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[adapters,media]>=0.36.13",
    "diffusers>=0.41,<0.42",
    "hf-xet>=1.6.0",
    # The AdaLN table producer owns the row-label reader the pruned DiT is built from.
    "minimax-h3-tools>=0.1.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pydantic-core>=2.46.4",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "seedvr2>=0.1.7",
    "shellingham>=1.5.4",
    "tensorfs>=0.17.13",
    "tokenizers>=0.23.1",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "h3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = [
    "gates.py",
    "h3.py",
    "minimax_h3",
    "story.py",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# seedvr2 and minimax-h3-tools are this account's own packages on the target Tensorhub, never
# PyPI. Creator writes the `tensorhub` index for the command's Hub and account; lock with
# `cozy package lock`.
[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
seedvr2 = { index = "tensorhub" }
minimax-h3-tools = { index = "tensorhub" }
