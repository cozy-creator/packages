[project]
name = "hidream-o1"
version = "0.2.0"
description = "Cozy text-to-image and reference editing with HiDream-O1-Image, full and Dev"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.37.0",
    "diffusers>=0.40",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.16",
    "tokenizers>=0.23.1",
    "torch>=2.13",
    "torchvision>=0.28",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "hidream_o1:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hidream_o1"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
