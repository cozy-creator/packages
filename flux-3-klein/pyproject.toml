[project]
name = "flux-3-klein"
version = "0.11.2"
description = "Cozy text-to-image and reference editing with FLUX.3 Image Klein, distilled and base"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.31",
    # Flux3 is in Diffusers main only (merged 2026-10-15, #15046).
    "diffusers @ git+https://github.com/huggingface/diffusers@7ecb1e1b4fe500be7fb7381a7bb79a24d7fa3941",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.13",
    "tokenizers>=0.23.1",
    "torch>=2.13",
    "torchvision>=0.28",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "flux_3_klein:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["flux_3_klein"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
