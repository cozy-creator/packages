[project]
name = "moss-image"
version = "0.6.1"
description = "Cozy text-to-image with MOSS-Image (OpenMOSS): layout boxes for objects and rendered text"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.43.1,<0.44",
    "diffusers>=0.40",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.17.6",
    "tokenizers>=0.23.1",
    "torch>=2.6",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "moss_image:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moss_image"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# PyPI's torch is CUDA on Linux and MPS on macOS but CPU-only on Windows: Windows takes PyTorch's CUDA build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
# 0.22.1's Runtime (0.43.1: 0.43's tools with the 0.21.3 batch) and the TensorFS it pins, by git rev until
# both publish: the release relocks to PyPI.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "e26bd7775eee7996d494dce5517061ee3c386fcc" }
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "a4f2f9545458efbb22cb3e0b36a110d21eb9a91d", subdirectory = "crates/tensorfs-py" }
